[package]
name = "antiphon-relay"
edition.workspace = true
version.workspace = true

[[bin]]
name = "antiphon-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Keys the SFU's join cookies; both already in the tree via the crypto crate.
getrandom = "0.4.3"
sha2 = "0.11.0"
antiphon-protocol = { version = "0.1.0", path = "../protocol" }
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
antiphon-net = { version = "0.1.0", path = "../net" }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Push wake-ups for inbox owners and senders (`--mailbox-push`).
antiphon-push = { version = "0.1.0", path = "../push" }

[features]
# Posting to Apple's push service, for an operator with an Apple developer
# key (`--apns-key` and friends). Off by default: it adds an HTTP/2 stack
# that nobody without that key can use. See docs/mobile-push.md.
apns = ["antiphon-push/apns", "clap/env"]
