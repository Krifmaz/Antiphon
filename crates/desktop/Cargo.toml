[package]
name = "antiphon"
description = "Stoop for the desktop: the shared iced interface on the desktop call engine"
edition.workspace = true
version.workspace = true

[[bin]]
name = "antiphon"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "canvas", "qr_code", "advanced"] }
antiphon-ui = { version = "0.1.0", path = "../ui" }
antiphon-client = { version = "0.1.0", path = "../client" }
antiphon-audio = { version = "0.1.0", path = "../audio" }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
antiphon-net = { version = "0.1.0", path = "../net" }
anyhow = "1.0.104"
# Local time for message timestamps and the greeting.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
device_query = "4.0.1"
getrandom = "0.4.3"
# The window icon, and the PNGs of `--screenshot-tour`.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Native file dialogs: choosing a file to send, saving one received.
rfd = "0.17.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
