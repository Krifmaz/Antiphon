[package]
name = "antiphon"
description = "Stoop for the desktop: the shared iced interface on the desktop call engine"
edition.workspace = true
version.workspace = true

[[bin]]
name = "antiphon"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "svg", "canvas", "qr_code", "image", "advanced"] }
antiphon-ui = { version = "0.1.0", path = "../ui" }
antiphon-client = { version = "0.1.0", path = "../client" }
# Which video a picture is (camera or screen), for the call's tiles.
antiphon-video = { version = "0.1.0", path = "../video" }
antiphon-audio = { version = "0.1.0", path = "../audio" }
antiphon-captions = { version = "0.1.0", path = "../captions" }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
antiphon-net = { version = "0.1.0", path = "../net" }
antiphon-update = { version = "0.1.0", path = "../update" }
anyhow = "1.0.104"
# Local time for message timestamps and the greeting.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
device_query = "4.0.1"
getrandom = "0.4.3"
# The window icon, and the PNGs of `--screenshot-tour`.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Native file dialogs: choosing a file to send, saving one received.
rfd = "0.17.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
# The local API's JSON lines, and the send queue kept between runs.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# Screen readers: the interface's tree, handed to each system's API.
accesskit = "0.24.1"

[target.'cfg(windows)'.dependencies]
# UI Automation (Narrator, NVDA, JAWS).
accesskit_windows = "0.34.0"

[target.'cfg(target_os = "macos")'.dependencies]
# NSAccessibility (VoiceOver).
accesskit_macos = "0.26.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# AT-SPI over D-Bus (Orca).
accesskit_unix = "0.22.1"
# The tray icon, as a StatusNotifierItem over D-Bus (no GTK needed).
ksni = "0.3.6"

[lints]
workspace = true
