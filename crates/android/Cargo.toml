[package]
name = "antiphon-android"
description = "Antiphon for Android: the shared iced phone app, started from a NativeActivity"
edition.workspace = true
version.workspace = true

[lib]
# cargo-apk loads this as the NativeActivity's library. No Java or Kotlin:
# the activity is the platform's own android.app.NativeActivity.
crate-type = ["cdylib"]
path = "src/lib.rs"

# Everything is Android-only, so `cargo build --workspace` on a desktop
# compiles an empty crate rather than a second GUI toolkit.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
jni = "0.21"
ndk-context = "0.1.1"
# Only for its Android backend; the window and everything drawn in it is
# antiphon-mobile's.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-native-activity"] }
antiphon-mobile = { version = "0.1.0", path = "../mobile" }

[package.metadata.android]
package = "org.antiphon.app"
apk_name = "antiphon"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Antiphon"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# Rotation and keyboard changes would otherwise restart the activity, which
# for a NativeActivity means tearing down the Rust side mid-call.
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard"
orientation = "portrait"
exported = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_feature]]
name = "android.hardware.microphone"
required = true
