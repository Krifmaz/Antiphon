<?xml version="1.0" encoding="UTF-8"?>
<!-- The Android launcher icon (crates/android/res), flattened onto its
     background: two voices answering each other. The PNGs beside this file
     were rendered from it once and are committed, so building the app
     needs no SVG renderer. Re-render them if this changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#1E2A3A"/>
  <path d="M46,38 A18,18 0 0,0 46,70 M38,30 A28,28 0 0,0 38,78" fill="none" stroke="#7FB2FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M62,38 A18,18 0 0,1 62,70 M70,30 A28,28 0 0,1 70,78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
