[package]
name = "antiphon-ui"
description = "Stoop's interface, shared by the desktop and phone apps: one look, one set of screens, in iced"
edition.workspace = true
version.workspace = true

# Only iced's portable halves: the widgets and the core. Each app brings the
# window -- the desktop through `iced` itself, the phones through their own
# winit runner. `wgpu` names the renderer the views are typed against; the
# desktop adds the software fallback beside it, and iced_widget's `Renderer`
# then resolves to the pair, so every view here is the type the app draws.

[dependencies]
# The screen-reader tree: plain data, handed to each platform's adapter by the app.
accesskit = "0.24.1"
iced_core = "0.14.0"
iced_widget = { version = "0.14.0", features = ["svg", "canvas", "qr_code", "image", "wgpu"] }
# Theme files from earlier builds: plain JSON data, read through serde only.
# Current theme files are Stoop's own markup (src/markup.rs), parsed by hand.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Reads the family name out of a font file someone imports, so the text
# engine can be asked for it by name.
ttf-parser = "0.25.1"

[lints]
workspace = true
