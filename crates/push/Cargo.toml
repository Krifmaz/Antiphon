[package]
name = "antiphon-push"
description = "Sending sealed push wake-ups to sleeping phones: endpoints, rate limits, UnifiedPush and APNs"
edition.workspace = true
version.workspace = true

# Three layers, so each user pulls in only what it needs:
#
# - always: what a push target is, how it travels in a route record, the
#   rate limiter and the APNs provider token (pure Rust, no I/O). The phone
#   builds with only this, to publish its own endpoint and to rate-limit
#   what it receives.
# - `send` (default): posting to a UnifiedPush endpoint over HTTPS with
#   ureq and rustls, which the desktop and the mailbox node use.
# - `apns`: Apple's provider API, which needs HTTP/2. Off by default
#   because only a node operator holding an Apple key can use it, and h2
#   is a sizeable dependency for everyone else to carry.

[features]
default = ["send"]
send = ["dep:ureq", "dep:tokio"]
apns = ["send", "dep:h2", "dep:http", "dep:bytes", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:serde_json"]

[dependencies]
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
base64 = "0.22.1"
# ES256 for the APNs provider token. Already in the tree; pure Rust.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }

ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros", "sync"], optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros"] }
