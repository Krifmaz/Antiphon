[package]
name = "antiphon-mobile"
description = "Stoop's phone app, shared by Android and iOS: iced on winit and wgpu"
edition.workspace = true
version.workspace = true

# Everything is phone-only, so `cargo build --workspace` on a desktop
# compiles only the two plain-std rule modules (for their tests) rather
# than a second GUI toolkit.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
log = "0.4"
# `image` draws pictures: a call's video, and the thumbnail a sender
# attaches to a photo they offer. antiphon-ui turns it on as well; it is
# named here because this crate builds image handles itself.
iced_wgpu = { version = "0.14.0", features = ["image"] }
iced_runtime = "0.14.0"
iced_core = "0.14.0"
iced_widget = { version = "0.14.0", features = ["wgpu", "image"] }
# The phone has fonts, but the fallback chain cosmic-text builds from them
# varies by vendor; bundling Fira Sans makes every device render the same.
iced_graphics = { version = "0.14.0", features = ["fira-sans"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
futures = { version = "0.3", features = ["executor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
antiphon-audio = { version = "0.1.0", path = "../audio" }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
antiphon-net = { version = "0.1.0", path = "../net" }
# Stoop's interface, the same screens the desktop draws.
antiphon-ui = { version = "0.1.0", path = "../ui" }
# The other side's camera and screen on a call. Without the `capture`
# feature: a phone's camera comes through the OS, not nokhwa.
antiphon-video = { version = "0.1.0", path = "../video" }
# The desktop's chat history, outbox and file-transfer modules are compiled
# into this crate as they are (see `lib.rs`); these are their dependencies
# rather than choices made here.
anyhow = "1.0.104"
# Making the thumbnail on a picture we offer and decoding the one on a
# picture offered to us, so only the formats a phone's gallery hands over,
# and nothing that pulls in threads.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

