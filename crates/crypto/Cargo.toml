[package]
name = "antiphon-crypto"
edition.workspace = true
version.workspace = true

[dependencies]
bip39 = { version = "2.2.2", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
# Same version ed25519-dalek is built on; used directly for the
# per-day key blinding in `dht_record.rs`.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "digest", "zeroize"] }
# `hazmat` for signing under a blinded key (`dht_record.rs`).
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "hazmat"] }
getrandom = "0.4.3"
# SFrame (RFC 9605) media keys, cipher suite AES_128_GCM_SHA256_128.
# See `sframe.rs`.
aes-gcm = "=0.11.1"
hkdf = "0.13.0"
hmac = "0.13.0"
# MLS (RFC 9420) for groups, spec §3. See `group.rs`. The basic-credential
# crate is not used: credentials are signed by our own identity key
# through `openmls_traits::signatures::Signer`, so an MLS member *is* the
# same Ed25519 identity a 1:1 contact pins.
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
# Our own storage provider for openmls, so a member can be saved and
# restored (group chats outlive a run of the app; see `group.rs`).
openmls_memory_storage = "=0.6.0"
sha2 = "0.11.0"
# The community manifest's JSON (see `community.rs`).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = "1.9.0"

[target.'cfg(not(windows))'.dependencies]
# Keychain on macOS, the Secret Service (GNOME Keyring, KWallet) on Linux,
# for spec §6's "private keys in the OS keystore". Pure Rust D-Bus, so no
# libdbus to install. See `keystore.rs`.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS has one keychain, the "protected data" store, and keyring's `v1`
# front end refuses the platform at run time, so `keystore.rs` installs
# this store itself. Naming the feature here also fixes the copy keyring
# pulls in, which will not build for iOS without it.
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
keyring-core = "1.0.1"

[target.'cfg(windows)'.dependencies]
# DPAPI, for spec §6's "private keys in the OS keystore".
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
hex = "0.4.3"
