[package]
name = "voip-gui"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
device_query = "4.0.1"
dirs = "6.0.0"
image = "0.25.10"
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.17.1", features = ["unstable-fontique-010"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
voip-audio = { version = "0.1.0", path = "../audio" }
voip-crypto = { version = "0.1.0", path = "../crypto" }
voip-net = { version = "0.1.0", path = "../net" }
voip-protocol = { version = "0.1.0", path = "../protocol" }

[build-dependencies]
slint-build = "1.17.1"
