[package]
name = "antiphon-net"
edition.workspace = true
version.workspace = true

[dependencies]
# Node keys for the DHT (`dht.rs`); both already in the tree via crypto.
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
sha2 = "0.11.0"
# Only for SO_RCVBUF; already in the tree underneath tokio.
socket2 = "0.6.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
antiphon-protocol = { version = "0.1.0", path = "../protocol" }
