[package]
name = "antiphon-net"
edition.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22.1"
# WireGuard (spec §6 "userspace WireGuard"): BLAKE2s, ChaCha20-Poly1305 and
# X25519 are the protocol's own primitives. Pure Rust on purpose: boringtun
# pulls in ring, whose C build breaks the Windows cross-build.
blake2 = "=0.11.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"
# Only for SO_RCVBUF; already in the tree underneath tokio.
socket2 = "0.6.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
antiphon-crypto = { version = "0.1.0", path = "../crypto" }
antiphon-protocol = { version = "0.1.0", path = "../protocol" }
