# One pipeline, every desktop target, from the same commit (spec §10).
#
# Jobs:
#   test     -- build + test + clippy on Linux and Windows for every push
#               and pull request. Required.
#   test-macos -- the same on macOS. Optional: macOS runners are sometimes
#               unavailable for hours (a queued job gets cancelled without
#               ever starting), and that should not hold a release back.
#   android  -- clippy the Android crate and build the APK (Rust + iced)
#               for every push and pull request. Required for a release.
#   ios      -- clippy the iOS crate and build the simulator app (and a
#               device build, signed when the IOS_* secrets exist) on
#               macOS. Optional, like test-macos; nothing waits on it.
#   version  -- decides whether this run releases, and as what (see Releases).
#   release  -- for a release, build the binaries the reproducible way
#               (BUILDING.md), twice on each platform, and refuse to publish
#               unless both builds hash identically. That turns "reproducible
#               in principle" into something checked on every release.
#   publish  -- attach every platform's binaries, the APK, and checksums to a GitHub
#               Release. Linux, Windows and the APK must be there; macOS ships when
#               its tests and reproducible build both passed.
#
# Releases, the way Encore does them:
#   Start one: Actions -> CI -> Run workflow. Versions are plain MAJOR.MINOR.PATCH;
#   by default the next one bumps PATCH of the newest v* release. Pick "minor" or
#   "major", or type the version (e.g. 1.0.0). The tag v<version> is created by the
#   release itself, so nothing has to be pushed by hand. Pushing a v* tag still works.
#   Notes: docs/releases/<version>.md if it exists, otherwise the commits since the
#   previous release. SHA256SUMS covers every file of the release.
#   Hotfixes: every push to main also publishes a hotfix release, version
#   <newest release>.<run number> (0.2.1.57), tagged hotfix-<version>, marked Latest
#   so the download link always has the newest build. Only the newest three
#   hotfixes are kept; a full release counts as newer than all of them, and the
#   bump above only looks at v* releases, so it never picks up a hotfix number.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Actions -> CI -> Run workflow: a release from this commit (see Releases).
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump for the next version"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or type the version to release (MAJOR.MINOR.PATCH); overrides bump"
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # BUILDING.md: the stated toolchain. Pinned here, per target, rather than
  # in a rust-toolchain.toml -- see that file for why.
  RUST_VERSION: "1.97.0"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          TYPED: ${{ inputs.version }}
        run: |
          # The newest full release, v<MAJOR>.<MINOR>.<PATCH> (a pre-release suffix is ignored).
          LAST=$(gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null \
            | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\(-.*\)\{0,1\}$/\1/p' | sort -V | tail -1)
          [ -n "$LAST" ] || LAST=$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' Cargo.toml 2>/dev/null | head -1)
          [ -n "$LAST" ] || LAST=0.1.0
          CHANNEL=""; V=""
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            CHANNEL=stable
            if [ -n "$TYPED" ]; then
              V="${TYPED#v}"
              echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$TYPED' is not MAJOR.MINOR.PATCH"; exit 1; }
            else
              IFS=. read -r MA MI PA <<< "$LAST"
              case "$BUMP" in
                major) V="$((MA + 1)).0.0" ;;
                minor) V="$MA.$((MI + 1)).0" ;;
                *) V="$MA.$MI.$((PA + 1))" ;;
              esac
            fi
            TAG="v$V"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHANNEL=stable; TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            CHANNEL=hotfix; V="$LAST.$GITHUB_RUN_NUMBER"; TAG="hotfix-$V"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG:-none} (${CHANNEL:-not a release})" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The user chose this (2026-10-26): GitHub's macOS runners are scarce,
    # and a job can sit queued until it is cancelled without running a
    # line. macOS still builds and tests on every push, but a missing Mac
    # runner no longer turns the pipeline red or holds back the release of
    # the other platforms and the APK.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps: &test-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        # javac and d8 for the app's few Java classes. Pinned, like Rust,
        # so the dex is built by the same compiler every time.
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces
        # The runner image carries the SDK and an NDK; this only makes sure
        # the platform the APK compiles against (TARGET_SDK in
        # crates/android/build-apk.sh) and a pinned build-tools are present.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"
      - name: Clippy (Android)
        run: cargo clippy -p antiphon-android -p antiphon-mobile --target aarch64-linux-android --locked -- -D warnings
      - name: Signing key
        # A release APK must be signed. With the ANDROID_KEYSTORE_BASE64 and
        # ANDROID_KEYSTORE_PASSWORD secrets set, every build is signed with
        # that one key, so a new version installs over the old. Without
        # them a throwaway key is made per build: the APK installs, but an
        # update means uninstalling first.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/antiphon-release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key"
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias antiphon -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Antiphon"
          fi
          echo "::add-mask::$PASS"
          echo "APK_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "APK_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build APK
        # crates/android/build-apk.sh rather than cargo-apk, which cannot
        # package the app's service and push receiver. Same path remapping
        # as the desktop release builds, so the builder's directories do not
        # end up inside the shipped library.
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export CARGO_ENCODED_RUSTFLAGS="$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo' "$PWD" "${CARGO_HOME:-$HOME/.cargo}")"
          mkdir -p out
          crates/android/build-apk.sh --out out/antiphon-android.apk
          cd out && sha256sum antiphon-android.apk | tee SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: out/*

  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps: *test-steps

  ios:
    name: ios (simulator app)
    # Linking for iOS needs Apple's SDK, so this is a macOS job, and so
    # optional for the same reason as test-macos: a Mac runner that never
    # turns up must not turn the pipeline red. Nothing needs it, publish
    # included -- there is no iOS release to attach yet, only a simulator
    # build to try.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Clippy (iOS)
        run: |
          cargo clippy -p antiphon-ios --target aarch64-apple-ios --locked -- -D warnings
          cargo clippy -p antiphon-ios --target aarch64-apple-ios-sim --locked -- -D warnings
      - name: Build the simulator app
        run: crates/ios/build-app.sh sim
      - name: Build for devices
        # Signed when the IOS_* secrets are set (see BUILDING.md), so the
        # .ipa installs on the phones in the profile; unsigned otherwise,
        # which at least proves the device build links.
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: crates/ios/build-app.sh device
      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent target/aarch64-apple-ios-sim/release/Antiphon.app out/Antiphon-simulator.app.zip
          if [ -f target/aarch64-apple-ios/release/Antiphon.ipa ]; then
            cp target/aarch64-apple-ios/release/Antiphon.ipa out/
          fi
          cd out && shasum -a 256 * | tee SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          # Not "antiphon-*": publish packages every artifact named that.
          name: app-ios
          path: out/*

  release:
    name: release (${{ matrix.os }})
    # Runs once Linux and Windows pass, whatever happened on macOS; the
    # macOS leg checks its own tests below.
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.version.outputs.tag != ''
    needs: [version, test, test-macos]
    runs-on: ${{ matrix.os }}
    # As in test: the macOS build never holds back the other platforms.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - name: macOS tests must have passed
        if: runner.os == 'macOS' && needs.test-macos.result != 'success'
        run: |
          echo "::error::test (macos-latest) did not pass (${{ needs.test-macos.result }}); not shipping a macOS build"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev
      - name: Reproducible environment
        shell: bash
        # CARGO_ENCODED_RUSTFLAGS rather than RUSTFLAGS, and Windows-form
        # paths on Windows: under Git Bash $PWD is /d/a/... while rustc sees
        # D:\a\..., so a POSIX-form prefix never matches and the path ships
        # in the binary. See BUILDING.md.
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          SRC="$PWD"; CH="${CARGO_HOME:-$HOME/.cargo}"; EXTRA=""
          if [ "$RUNNER_OS" = Windows ]; then
            SRC="$(cygpath -w "$SRC")"; CH="$(cygpath -w "$CH")"
            # The MSVC linker stamps the current time into the PE header
            # unless told otherwise; see .cargo/config.toml. Setting the
            # environment variable replaces that file's flags, so repeat it.
            EXTRA=$'\x1f-Clink-arg=/Brepro'
          fi
          printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo%s\n' "$SRC" "$CH" "$EXTRA" >> "$GITHUB_ENV"
      - name: Build once
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out/first
          cp target/${{ matrix.target }}/release/antiphon${{ matrix.ext }} target/${{ matrix.target }}/release/antiphon-cli${{ matrix.ext }} out/first/
      - name: Build again from clean
        shell: bash
        run: |
          cargo clean
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out/second
          cp target/${{ matrix.target }}/release/antiphon${{ matrix.ext }} target/${{ matrix.target }}/release/antiphon-cli${{ matrix.ext }} out/second/
      - name: Refuse to ship anything that does not reproduce
        shell: bash
        run: |
          cd out
          for bin in antiphon${{ matrix.ext }} antiphon-cli${{ matrix.ext }}; do
            cmp first/$bin second/$bin || {
              echo "::error::$bin differs between two builds of the same commit ($(cmp -l first/$bin second/$bin | wc -l) bytes, first at offset $(cmp -l first/$bin second/$bin | head -1 | awk '{print $1}'))"
              exit 1
            }
          done
          # sha256sum on Linux and Git Bash for Windows; macOS ships only shasum.
          cd first
          if command -v sha256sum >/dev/null; then sha256sum *; else shasum -a 256 *; fi > ../SHA256SUMS-${{ matrix.target }}.txt
          cat ../SHA256SUMS-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: antiphon-${{ matrix.target }}
          path: |
            out/first/*
            out/SHA256SUMS-${{ matrix.target }}.txt

  publish:
    name: publish
    # Not skipped when the macOS leg fails; the check below decides.
    # A failed APK stops it.
    if: >-
      !cancelled() && needs.release.result != 'skipped' &&
      needs.android.result == 'success' && needs.version.outputs.tag != ''
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    needs: [version, release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes
        run: |
          if [ -f "docs/releases/$VERSION.md" ]; then
            cp "docs/releases/$VERSION.md" notes.md
          else
            # The commits since the previous full release (or hotfix, for a hotfix).
            if [ "$CHANNEL" = hotfix ]; then PATTERN='^(v[0-9]+\.[0-9]+\.[0-9]+|hotfix-.*)$'; else PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'; fi
            PREV=$(gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' | grep -E "$PATTERN" | grep -vx "$TAG" | head -1 || true)
            {
              if [ "$CHANNEL" = hotfix ]; then echo "The newest build of main. Hotfixes are kept three at a time; the newest full release is under Releases."; echo; fi
              echo "## Changes"
              echo
              if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
                git log --no-merges --format='- %s' "$PREV..HEAD"
              else
                git log --no-merges --format='- %s' -30
              fi
            } > notes.md
          fi
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Linux and Windows builds are required
        run: |
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            [ -d artifacts/antiphon-$t ] || { echo "::error::no $t build; not publishing"; exit 1; }
          done
          [ -d artifacts/antiphon-aarch64-apple-darwin ] || echo "::warning::publishing without a macOS build"
      - name: Package per platform
        run: |
          cd artifacts
          # The APK ships as it is: it is already a signed archive.
          mv apk-android/antiphon-android.apk .
          for d in antiphon-*/; do
            d=${d%/}
            case $d in *windows*) (cd $d && zip -r ../$d.zip .) ;; *) tar czf $d.tar.gz -C $d . ;; esac
          done
          # Hashes of the archives (what a downloader verifies),
          # then of the binaries inside them (what a rebuild is compared to).
          sha256sum *.zip *.tar.gz *.apk > SHA256SUMS.txt
          cat antiphon-*/SHA256SUMS-*.txt >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.CHANNEL == 'hotfix' && format('Stoop {0} (hotfix)', env.VERSION) || format('Stoop {0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.CHANNEL != 'hotfix' && contains(env.VERSION, '-') }}
          make_latest: "true"
          body_path: notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
      - name: Keep only the newest three hotfixes
        if: env.CHANNEL == 'hotfix'
        run: |
          OLD=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n 's/^hotfix-\([0-9.]*\)$/\1/p' | sort -rV | tail -n +4)
          for v in $OLD; do echo "deleting hotfix-$v"; gh release delete "hotfix-$v" --yes --cleanup-tag || true; done
