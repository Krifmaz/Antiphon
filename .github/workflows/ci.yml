# Build, test and clippy for every push and pull request (spec §10).
#
# Jobs:
#   test       -- Linux and Windows. Required.
#   test-macos -- the same on macOS. Optional: macOS runners are sometimes
#                 unavailable for hours (a queued job gets cancelled without
#                 ever starting), and that should not hold anything back.
#   android    -- clippy the Android crate and build the APK with
#                 crates/android/build-apk.sh, so a broken APK shows up on
#                 the push that broke it rather than at release time.
#   ios        -- clippy the iOS crate and build the simulator app (and a
#                 device build, signed when the IOS_* secrets exist) on
#                 macOS. Optional, like test-macos; nothing waits on it.
#
# Releases are made by release.yml (Actions -> release -> Run workflow).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # BUILDING.md: the stated toolchain. Pinned here, per target, rather than
  # in a rust-toolchain.toml -- see that file for why.
  RUST_VERSION: "1.97.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps: &test-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libxcb1-dev libclang-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps: *test-steps

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        # javac and d8 for the app's few Java classes. Pinned, like Rust,
        # so the dex is built by the same compiler every time.
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces
        # The runner image carries the SDK and an NDK; this only makes sure
        # the platform the APK compiles against (TARGET_SDK in
        # crates/android/build-apk.sh) and a pinned build-tools are present.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"
      - name: Clippy (Android)
        run: cargo clippy -p antiphon-android -p antiphon-mobile --target aarch64-linux-android --locked -- -D warnings
      - name: Signing key
        # A release APK must be signed. With the ANDROID_KEYSTORE_BASE64 and
        # ANDROID_KEYSTORE_PASSWORD secrets set, every build is signed with
        # that one key, so a new version installs over the old. Without
        # them a throwaway key is made per build: the APK installs, but an
        # update means uninstalling first.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/antiphon-release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key"
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias antiphon -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Antiphon"
          fi
          echo "::add-mask::$PASS"
          echo "APK_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "APK_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build APK
        # crates/android/build-apk.sh rather than cargo-apk, which cannot
        # package the app's service and push receiver. Same path remapping
        # as the desktop release builds, so the builder's directories do not
        # end up inside the shipped library.
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export CARGO_ENCODED_RUSTFLAGS="$(printf -- '--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo' "$PWD" "${CARGO_HOME:-$HOME/.cargo}")"
          mkdir -p out
          crates/android/build-apk.sh --out out/antiphon-android.apk
          cd out && sha256sum antiphon-android.apk | tee SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: out/*

  ios:
    name: ios (simulator app)
    # Linking for iOS needs Apple's SDK, so this is a macOS job, and so
    # optional for the same reason as test-macos: a Mac runner that never
    # turns up must not turn the pipeline red. Nothing needs it, publish
    # included -- there is no iOS release to attach yet, only a simulator
    # build to try.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Clippy (iOS)
        run: |
          cargo clippy -p antiphon-ios --target aarch64-apple-ios --locked -- -D warnings
          cargo clippy -p antiphon-ios --target aarch64-apple-ios-sim --locked -- -D warnings
      - name: Build the simulator app
        run: crates/ios/build-app.sh sim
      - name: Build for devices
        # Signed when the IOS_* secrets are set (see BUILDING.md), so the
        # .ipa installs on the phones in the profile; unsigned otherwise,
        # which at least proves the device build links.
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: crates/ios/build-app.sh device
      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent target/aarch64-apple-ios-sim/release/Antiphon.app out/Antiphon-simulator.app.zip
          if [ -f target/aarch64-apple-ios/release/Antiphon.ipa ]; then
            cp target/aarch64-apple-ios/release/Antiphon.ipa out/
          fi
          cd out && shasum -a 256 * | tee SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          # Not "antiphon-*": publish packages every artifact named that.
          name: app-ios
          path: out/*
