# One pipeline, every desktop target, from the same commit (spec §10).
#
# Jobs:
#   test     -- build + test + clippy on Linux and Windows for every push
#               and pull request. Required.
#   test-macos -- the same on macOS. Optional: macOS runners are sometimes
#               unavailable for hours (a queued job gets cancelled without
#               ever starting), and that should not hold a release back.
#   release  -- on a tag, build the release binaries the reproducible way
#               (BUILDING.md), twice on each platform, and refuse to publish
#               unless both builds hash identically. That turns "reproducible
#               in principle" into something checked on every release.
#   publish  -- attach every platform's binaries and checksums to a GitHub
#               Release for the tag. Linux and Windows must be there; macOS
#               ships when its tests and reproducible build both passed. A pre-release when the tag says so
#               (v0.1.0-rc1), a release otherwise. Also reachable by hand
#               through workflow_dispatch, which creates the tag too.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Manual release from any branch: builds exactly as a tag push would,
  # and the publish job creates the tag at this commit along with the
  # Release. For when a tag cannot be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0-rc1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # BUILDING.md: the stated toolchain. Pinned here, per target, rather than
  # in a rust-toolchain.toml -- see that file for why.
  RUST_VERSION: "1.97.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps: &test-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps: *test-steps

  release:
    name: release (${{ matrix.os }})
    # Runs once Linux and Windows pass, whatever happened on macOS; the
    # macOS leg checks its own tests below.
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [test, test-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform: the name a downloader sees in the asset file name.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
    steps:
      - name: macOS tests must have passed
        if: runner.os == 'macOS' && needs.test-macos.result != 'success'
        run: |
          echo "::error::test (macos-latest) did not pass (${{ needs.test-macos.result }}); not shipping a macOS build"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev
      - name: Reproducible environment
        shell: bash
        # CARGO_ENCODED_RUSTFLAGS rather than RUSTFLAGS, and Windows-form
        # paths on Windows: under Git Bash $PWD is /d/a/... while rustc sees
        # D:\a\..., so a POSIX-form prefix never matches and the path ships
        # in the binary. See BUILDING.md.
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          SRC="$PWD"; CH="${CARGO_HOME:-$HOME/.cargo}"; EXTRA=""
          if [ "$RUNNER_OS" = Windows ]; then
            SRC="$(cygpath -w "$SRC")"; CH="$(cygpath -w "$CH")"
            # The MSVC linker stamps the current time into the PE header
            # unless told otherwise; see .cargo/config.toml. Setting the
            # environment variable replaces that file's flags, so repeat it.
            EXTRA=$'\x1f-Clink-arg=/Brepro'
          fi
          printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo%s\n' "$SRC" "$CH" "$EXTRA" >> "$GITHUB_ENV"
      - name: Build once
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out/first
          cp target/${{ matrix.target }}/release/antiphon${{ matrix.ext }} target/${{ matrix.target }}/release/antiphon-cli${{ matrix.ext }} out/first/
      - name: Build again from clean
        shell: bash
        run: |
          cargo clean
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out/second
          cp target/${{ matrix.target }}/release/antiphon${{ matrix.ext }} target/${{ matrix.target }}/release/antiphon-cli${{ matrix.ext }} out/second/
      - name: Refuse to ship anything that does not reproduce
        shell: bash
        run: |
          cd out
          for bin in antiphon${{ matrix.ext }} antiphon-cli${{ matrix.ext }}; do
            cmp first/$bin second/$bin || {
              echo "::error::$bin differs between two builds of the same commit ($(cmp -l first/$bin second/$bin | wc -l) bytes, first at offset $(cmp -l first/$bin second/$bin | head -1 | awk '{print $1}'))"
              exit 1
            }
          done
          # sha256sum on Linux and Git Bash for Windows; macOS ships only shasum.
          cd first
          if command -v sha256sum >/dev/null; then sha256sum *; else shasum -a 256 *; fi
      - name: Stage what ships
        # Only the verified binaries and the README, at the top of the
        # archive. The first/second build directories are scratch for the
        # check above and must not leak into the download.
        shell: bash
        run: |
          mkdir -p dist
          cp out/first/* dist/
          cp README.md dist/
          for f in LICENSE LICENSE-MIT LICENSE-APACHE; do [ -f "$f" ] && cp "$f" dist/; done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    # Not skipped when the macOS leg fails; the check below decides.
    if: >-
      !cancelled() && needs.release.result != 'skipped' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Linux and Windows builds are required
        run: |
          for p in linux-x86_64 windows-x86_64; do
            [ -d artifacts/$p ] || { echo "::error::no $p build; not publishing"; exit 1; }
          done
          [ -d artifacts/macos-aarch64 ] || echo "::warning::publishing without a macOS build"
      - name: Package per platform
        # stoop-<version>-<platform>.zip on Windows, .tar.gz elsewhere,
        # with the app at the top level. One SHA256SUMS.txt for everything:
        # the archives (what a downloader verifies), then the binaries
        # inside them (what a reproducible rebuild is compared to).
        run: |
          VER="${TAG#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir release
          cd artifacts
          for p in */; do
            p=${p%/}
            # upload-artifact drops the executable bit.
            chmod +x $p/antiphon* 2>/dev/null || true
            name=stoop-$VER-$p
            case $p in
              windows-*) (cd $p && zip -X -q ../../release/$name.zip *) ;;
              *) tar czf ../release/$name.tar.gz --owner=0 --group=0 -C $p $(ls $p) ;;
            esac
          done
          cd ../release
          sha256sum * > ../SHA256SUMS.txt
          cd ../artifacts
          sha256sum */antiphon* >> ../SHA256SUMS.txt
          cd ..
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
          ls -l release
      - name: Release notes
        run: |
          kind="Release"
          case "$TAG" in *-*) kind="Pre-release: for testing, expect rough edges" ;; esac
          row() { [ -f "release/$2" ] && echo "| $1 | [\`$2\`](https://github.com/${{ github.repository }}/releases/download/$TAG/$2) |"; return 0; }
          {
            echo "**$kind.** Built from \`${GITHUB_SHA::7}\`, every binary built twice and checked to be byte-identical before it was published."
            echo
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            row "Windows (x64)" "stoop-$VER-windows-x86_64.zip"
            row "Linux (x64)" "stoop-$VER-linux-x86_64.tar.gz"
            row "macOS (Apple silicon)" "stoop-$VER-macos-aarch64.tar.gz"
            echo
            echo "Each archive holds \`antiphon\` (the Stoop desktop app), \`antiphon-cli\` and the README. Unzip and run \`antiphon\`; nothing to install."
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
            echo
            echo "---"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Stoop ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: notes.md
          generate_release_notes: true
          files: release/*
