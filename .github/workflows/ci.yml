# Build, test and clippy for every push and pull request (spec §10).
#
# Jobs:
#   test       -- Linux and Windows. Required.
#   test-macos -- the same on macOS. Optional: macOS runners are sometimes
#                 unavailable for hours (a queued job gets cancelled without
#                 ever starting), and that should not hold anything back.
#
# Releases are made by release.yml (Actions -> release -> Run workflow).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # BUILDING.md: the stated toolchain. Pinned here, per target, rather than
  # in a rust-toolchain.toml -- see that file for why.
  RUST_VERSION: "1.97.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps: &test-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    steps: *test-steps
