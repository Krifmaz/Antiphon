name: release

# Stoop's releases, the way Encore makes them. Two kinds:
#   Releases: Actions → release → Run workflow. A normal GitHub release tagged v<version>, titled
#   "Stoop <version>" and marked Latest. Versions are plain MAJOR.MINOR.PATCH: by default the next number
#   bumps PATCH of the newest v<version> release; pick "minor"/"major" or type the version by hand (e.g.
#   1.0.0). The first release takes the version in Cargo.toml. The tag is made through the API (the
#   API may create tags; a git push from the Actions token may not). Untick "publish" to build and package
#   everything without making a release: the files stay on the run as artifacts, the notes in its summary.
#   Hotfixes: every push to main. Version <newest release>.<run number> (0.2.1.57), tagged hotfix-<version>,
#   titled "Stoop <version> (hotfix)" and marked Latest, so the download link always has the newest build.
#   Only the newest three hotfixes are kept; a full release counts as newer than all of them, and the bump
#   above only looks at v<version> releases, so it never picks up a hotfix number.
#   A pull request that changes the packaging runs everything but the publish step, so a broken installer
#   shows up before a release needs it.
#
#   Files (packaging/package.sh; the Android job runs once crates/android is in the tree):
#     Windows  Stoop-<v>-windows-x86_64.exe     the installer, per user, no administrator rights
#              Stoop-<v>-windows-x86_64.msi     the same as an MSI, for Group Policy, Intune or winget
#     Linux    Stoop-<v>-linux-x86_64.AppImage, stoop_<v>_amd64.deb, stoop-<v>-linux-x86_64.tar.gz and
#              Stoop-<v>-linux-x86_64.flatpak   (a single-file bundle on the newest org.freedesktop.Platform)
#     macOS    Stoop-<v>-macos-aarch64.dmg      signed ad hoc
#     Android  Stoop-android-<v>.apk            built twice from clean and compared, like the desktop binaries
#     SHA256SUMS covers every file of the release, then the bare desktop binaries inside them (BUILDING.md).
#     Every file also gets a signed build attestation (Sigstore, through GitHub): which workflow run built it,
#     from which commit. `gh attestation verify <file> -R Krifmaz/Stoop` checks one.
#   Notes: docs/releases/<version>.md if it exists, otherwise the commit list since the previous release,
#   then an Install section naming the files. Linux, Windows and (when it is built) Android are required.
#   The release does not wait for macOS, whose runners are sometimes unavailable for hours: mac-attach adds
#   the .dmg, its checksums and its Install line when build-macos finishes, or says it is not in this release.
#   Every desktop binary is built twice from clean and compared byte for byte before it is packaged
#   (spec §10); one that differs fails its platform. The version is written into the workspace first
#   (packaging/set-version.sh), so `--version` and the About screen show it.
#   Re-running a version replaces its release. cleanup-releases.yml deletes old ones.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number to bump for the next version"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or type the version to release (MAJOR.MINOR.PATCH); overrides bump"
        type: string
        default: ""
      publish:
        description: "Publish the release (untick to build and package only)"
        type: boolean
        default: true

permissions:
  contents: write

# Hotfixes are batched: one builds at a time and is never cancelled, so it always gets to publish, and of the
# pushes that land meanwhile only the newest waits its turn (GitHub keeps one pending run per group and drops
# the older ones). That keeps a busy day from either cancelling every hotfix or queueing a dozen of them for
# the runners. A release has a group of its own, so it never waits for a hotfix or for an older release whose
# macOS job is still queued; two runs of one version only meet in publish, which has a group per tag. A pull
# request's check is replaced by the next push to that pull request.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('release-check-{0}', github.ref)
    || github.event_name == 'push' && 'release-hotfix'
    || format('release-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # BUILDING.md: the stated toolchain
  RUST_VERSION: "1.97.0"
  # the binaries keep their crate names until the rename lands; the packages are called Stoop
  APP_BIN: antiphon
  CLI_BIN: antiphon-cli

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      semver: ${{ steps.v.outputs.semver }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      android: ${{ steps.v.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semver() { echo "$1" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; }
          # the newest release so far: tags v<MAJOR.MINOR.PATCH> (the old -rc and -test ones and hotfixes don't count)
          LAST=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
                  | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          CARGO_V=$(awk '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version *= *"/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)
          case "$GITHUB_EVENT_NAME" in
            push)
              # a hotfix: the newest release with the run number as a fourth part
              CHANNEL=hotfix; SV="${LAST:-$CARGO_V}"; V="$SV.$GITHUB_RUN_NUMBER"; TAG="hotfix-$V" ;;
            *)
              CHANNEL=stable
              [ "$GITHUB_EVENT_NAME" = pull_request ] && CHANNEL=check
              if [ -n "$WANT" ]; then
                V="${WANT#v}"
              elif [ -z "$LAST" ]; then
                V="$CARGO_V"                            # the first release
              else
                IFS=. read -r A B C <<< "$LAST"
                case "$BUMP" in
                  major) V="$((A + 1)).0.0" ;;
                  minor) V="$A.$((B + 1)).0" ;;
                  *)     V="$A.$B.$((C + 1))" ;;
                esac
              fi
              SV="$V"; TAG="v$V" ;;
          esac
          semver "$SV" || { echo "::error::bad version $V (want MAJOR.MINOR.PATCH)"; exit 1; }
          {
            echo "version=$V"; echo "semver=$SV"; echo "channel=$CHANNEL"; echo "tag=$TAG"
            # the Android app is built once its crate is in the tree
            [ -x crates/android/build-apk.sh ] && echo "android=true" || echo "android=false"
          } >> "$GITHUB_OUTPUT"
          echo "$CHANNEL: Stoop $V ($TAG)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tag ${{ steps.v.outputs.tag }}
        # The tag is made now, not by publish: GitHub refuses (HTTP 403) to let the Actions token create a tag
        # at a commit whose workflow files differ from main's, and they do differ as soon as anything changes
        # .github/workflows during the hour of building. Right now this run's commit is main's newest, so the
        # tag can be made; publish then only attaches the release to it. A re-run moves the tag to this commit.
        if: steps.v.outputs.channel == 'hotfix' || (steps.v.outputs.channel == 'stable' && inputs.publish)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null

  build:
    name: build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"
    env: &build-env
      V: ${{ needs.version.outputs.version }}
      SV: ${{ needs.version.outputs.semver }}
    steps: &build-steps
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        # the build libraries, then dpkg-dev for the .deb's Depends line and `file` for appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libgtk-3-dev dpkg-dev file \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libxcb1-dev libclang-dev
      - name: NSIS and WiX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v makensis >/dev/null || [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ] || choco install nsis -y --no-progress
          # WiX 4 for the MSI, pinned like the rest of the toolchain
          dotnet tool install --global wix --version 4.0.6
          echo "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"
      - name: Flatpak runtime (Linux)
        if: runner.os == 'Linux'
        # the runtime the Flatpak runs on, and its SDK, which flatpak-builder needs even though nothing compiles
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # the newest branch: the binaries are built on this runner, so the runtime's glibc must be as new as its
          RT=$(flatpak --user remote-ls flathub --runtime --columns=ref | sed -n 's|^org\.freedesktop\.Platform/x86_64/\([0-9][0-9.]*\)$|\1|p' | sort -V | tail -1)
          [ -n "$RT" ] || { echo "::error::no org.freedesktop.Platform on Flathub"; exit 1; }
          echo "FLATPAK_RUNTIME=$RT" >> "$GITHUB_ENV"
          flatpak --user install -y --noninteractive flathub "org.freedesktop.Platform//$RT" "org.freedesktop.Sdk//$RT"
      - name: Version ${{ env.SV }}
        shell: bash
        run: bash packaging/set-version.sh "$SV"
      - name: Tests
        shell: bash
        run: cargo test --workspace --locked
      - name: Reproducible environment
        shell: bash
        # CARGO_ENCODED_RUSTFLAGS rather than RUSTFLAGS, and Windows-form
        # paths on Windows: under Git Bash $PWD is /d/a/... while rustc sees
        # D:\a\..., so a POSIX-form prefix never matches and the path ships
        # in the binary. See BUILDING.md.
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          SRC="$PWD"; CH="${CARGO_HOME:-$HOME/.cargo}"; EXTRA=""
          if [ "$RUNNER_OS" = Windows ]; then
            SRC="$(cygpath -w "$SRC")"; CH="$(cygpath -w "$CH")"
            # The MSVC linker stamps the current time into the PE header
            # unless told otherwise; see .cargo/config.toml. Setting the
            # environment variable replaces that file's flags, so repeat it.
            EXTRA=$'\x1f-Clink-arg=/Brepro'
          fi
          printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo%s\n' "$SRC" "$CH" "$EXTRA" >> "$GITHUB_ENV"
      - name: Build once
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin "$APP_BIN" --bin "$CLI_BIN"
          mkdir -p scratch/first
          cp target/${{ matrix.target }}/release/{$APP_BIN,$CLI_BIN}${{ matrix.ext }} scratch/first/
      - name: Build again from clean
        shell: bash
        run: |
          cargo clean
          cargo build --release --locked --target ${{ matrix.target }} --bin "$APP_BIN" --bin "$CLI_BIN"
          mkdir -p scratch/second
          cp target/${{ matrix.target }}/release/{$APP_BIN,$CLI_BIN}${{ matrix.ext }} scratch/second/
      - name: Refuse to ship anything that does not reproduce
        shell: bash
        run: |
          for bin in $APP_BIN${{ matrix.ext }} $CLI_BIN${{ matrix.ext }}; do
            cmp scratch/first/$bin scratch/second/$bin || {
              echo "::error::$bin differs between two builds of the same commit ($(cmp -l scratch/first/$bin scratch/second/$bin | wc -l) bytes, first at offset $(cmp -l scratch/first/$bin scratch/second/$bin | head -1 | awk '{print $1}'))"
              exit 1
            }
          done
          # the bare binaries' hashes, for SHA256SUMS (sha256sum on Linux and Git Bash, shasum on macOS)
          mkdir -p hashes
          cd scratch/first
          if command -v sha256sum >/dev/null; then sha256sum -- *; else shasum -a 256 -- *; fi \
            | sed 's|^\([0-9a-f]*\) [ *]|\1  ${{ matrix.platform }}/|' > ../../hashes/${{ matrix.platform }}.sha256
          cat ../../hashes/${{ matrix.platform }}.sha256
      - name: Package
        shell: bash
        # every kind named, so a missing tool fails the build instead of quietly leaving a package out;
        # FLATPAK_CHECK installs the Flatpak and fails if the runtime lacks a library the app links
        run: |
          case "$RUNNER_OS" in
            Linux)   ONLY=(--only appimage,deb,tar,flatpak); export FLATPAK_CHECK=1 ;;
            Windows) ONLY=(--only nsis,msi) ;;
            *)       ONLY=() ;;
          esac
          bash packaging/package.sh --version "$V" --bin scratch/first --out dist "${ONLY[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: Stoop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.platform }}
          path: hashes/*

  # macOS on its own: the release does not wait for it. Its runners are sometimes unavailable for hours
  # (a job can sit queued all afternoon), so the release goes out with Windows, Linux and Android and
  # mac-attach adds the .dmg once this job finishes.
  build-macos:
    name: build (macos-aarch64)
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
    env: *build-env
    steps: *build-steps

  android:
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      SV: ${{ needs.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v4
        # javac and d8 for the app's few Java classes, pinned like Rust
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK pieces
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"
      - name: Version ${{ env.SV }}
        run: bash packaging/set-version.sh "$SV"
      - name: Signing key
        # With the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets every release is signed with that
        # one key, so a new version installs over the old. Without them a throwaway key is made per build: the
        # APK installs, but an update means uninstalling first.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/stoop-release.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning title=Android signing::ANDROID_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key"
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias antiphon -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Stoop"
          fi
          echo "::add-mask::$PASS"
          echo "APK_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "APK_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Reproducible environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          printf 'CARGO_ENCODED_RUSTFLAGS=--remap-path-prefix=%s=/build\x1f--remap-path-prefix=%s=/cargo\n' "$PWD" "${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Build the APK once
        run: crates/android/build-apk.sh --out scratch/first.apk
      - name: Build it again from clean
        run: |
          cargo clean
          crates/android/build-apk.sh --out scratch/second.apk
      - name: Refuse to ship an APK that does not reproduce
        # Both builds are signed with the same key, and an RSA signature over the same bytes is the same, so
        # the two files match byte for byte when the build is reproducible. If not, the entries that differ
        # are listed.
        run: |
          if ! cmp scratch/first.apk scratch/second.apk; then
            mkdir -p scratch/a scratch/b
            unzip -q scratch/first.apk -d scratch/a; unzip -q scratch/second.apk -d scratch/b
            echo "::error::the APK differs between two builds of the same commit; differing entries:"
            diff -rq scratch/a scratch/b || true
            exit 1
          fi
          sha256sum scratch/first.apk
          mkdir -p dist
          cp scratch/first.apk "dist/Stoop-android-$V.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stoop-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: Stoop-android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [version, build, android]
    permissions:
      contents: write
      id-token: write     # the Sigstore certificate for the attestations
      attestations: write
    # two runs of one version publish one after the other, never at once
    concurrency:
      group: publish-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    # also when the macOS build did not run or failed (the checks below decide), but not for a cancelled run
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      ANDROID: ${{ needs.version.outputs.android }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Stoop-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
          merge-multiple: true
      - name: Linux, Windows and Android are required
        run: |
          ls -la out
          need="Stoop-$V-windows-x86_64.exe Stoop-$V-windows-x86_64.msi Stoop-$V-linux-x86_64.AppImage stoop_${V}_amd64.deb stoop-$V-linux-x86_64.tar.gz Stoop-$V-linux-x86_64.flatpak"
          [ "$ANDROID" = true ] && need="$need Stoop-android-$V.apk"
          for f in $need; do
            [ -f "out/$f" ] || { echo "::error::no $f: not publishing"; exit 1; }
          done
      - name: Notes
        run: |
          have() { [ -f "out/$1" ]; }
          # the previous release (a hotfix also counts the hotfixes before it)
          if [ "$CHANNEL" = hotfix ]; then PATTERN='^(v[0-9]+\.[0-9]+\.[0-9]+|hotfix-.*)$'; else PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'; fi
          PREV=$(git tag -l --sort=-creatordate | grep -E "$PATTERN" | grep -vx "$TAG" | head -1 || true)
          [ -n "$PREV" ] || PREV=$(git tag -l 'v[0-9]*' --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          if [ "$CHANNEL" != hotfix ] && [ -f "docs/releases/$V.md" ]; then cp "docs/releases/$V.md" notes.md; else
            {
              if [ "$CHANNEL" = hotfix ]; then
                echo "Hotfix build of \`${GITHUB_SHA::7}\` (main after ${PREV:-the first release}). The next full release replaces it."
                echo
              fi
              echo "## Changes"
              git log --no-merges --pretty='- %s' ${PREV:+$PREV..}HEAD | head -60
            } > notes.md
          fi
          {
            echo
            echo "---"
            echo "### Install"
            echo "* **Windows**: \`Stoop-$V-windows-x86_64.exe\` – the installer, for you only, no administrator rights; Stoop is in the Start menu afterwards · for deploying to many PCs: \`Stoop-$V-windows-x86_64.msi\`"
            echo "* **Linux**: \`Stoop-$V-linux-x86_64.AppImage\` (make it executable and run it), \`stoop_${V}_amd64.deb\` (\`sudo apt install ./stoop_${V}_amd64.deb\`) or \`Stoop-$V-linux-x86_64.flatpak\` (\`flatpak install --user Stoop-$V-linux-x86_64.flatpak\`) · without installing: \`stoop-$V-linux-x86_64.tar.gz\`"
            if have "Stoop-$V-macos-aarch64.dmg"; then
              echo "* **macOS** (Apple silicon): \`Stoop-$V-macos-aarch64.dmg\` (if macOS will not open it the first time: System Settings → Privacy & Security → Open Anyway)"
            fi
            if have "Stoop-android-$V.apk"; then echo "* **Android**: \`Stoop-android-$V.apk\`"; fi
            if ! have "Stoop-$V-macos-aarch64.dmg"; then
              # mac-attach replaces this line (MACOS-PENDING) once the macOS build finishes or fails
              echo "* **macOS**: still building, the .dmg is added here when it finishes <!-- MACOS-PENDING -->"
            fi
            echo "* Every desktop binary and the APK were built twice from clean and the two compared byte for byte · checksums in \`SHA256SUMS\` · every file has a signed build attestation: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`"
          } >> notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Checksums
        # every file of the release, then the bare binaries inside them (what a rebuild is compared to, BUILDING.md)
        run: |
          (cd out && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS)
          cat hashes/*.sha256 >> out/SHA256SUMS
          cat out/SHA256SUMS
      - name: Sign
        # a Sigstore-signed provenance statement for every file (and SHA256SUMS): built by this workflow, in
        # this run, from this commit. Only for a release that is published, so a check run signs nothing.
        if: env.CHANNEL == 'hotfix' || (env.CHANNEL == 'stable' && inputs.publish)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Publish
        if: env.CHANNEL == 'hotfix' || (env.CHANNEL == 'stable' && inputs.publish)
        run: |
          TITLE="Stoop $V"; [ "$CHANNEL" = hotfix ] && TITLE="Stoop $V (hotfix)"
          # the tag stays: the version job made it at this commit (see "Tag" there)
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Latest only when no newer release is out: hotfixes now run side by side, so an older push can
          # finish after a newer one, and a hotfix of 0.1.0 can finish after 0.2.0. Hotfix 0.1.0.57 sorts
          # after 0.1.0 and before 0.1.1.
          OTHERS=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n 's/^v\([0-9.]*\)$/\1/p; s/^hotfix-\([0-9.]*\)$/\1/p')
          TOP=$(printf '%s\n' $OTHERS "$V" | sort -V | tail -1)
          LATEST=--latest=false; [ "$TOP" = "$V" ] && LATEST=--latest
          echo "newest release: $TOP ($LATEST)"
          gh release create "$TAG" out/* --title "$TITLE" --notes-file notes.md --verify-tag "$LATEST"
      - name: Keep only the newest three hotfixes
        if: env.CHANNEL == 'hotfix'
        # a failed clean-up never fails the hotfix: the next one tries again
        continue-on-error: true
        run: |
          OLD=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n 's/^hotfix-\([0-9.]*\)$/\1/p' | sort -rV | tail -n +4)
          for v in $OLD; do echo "deleting hotfix-$v"; gh release delete "hotfix-$v" --yes --cleanup-tag || true; done
          # and the tags of hotfix runs that were cancelled or failed before they published. Hotfixes run side
          # by side, so a tag without a release may belong to a run still building: only a tag whose commit is
          # more than six hours old is left over.
          KEEP=$(gh release list --limit 200 --json tagName -q '.[].tagName')
          CUTOFF=$(( $(date +%s) - 6 * 3600 ))
          git ls-remote --tags origin 'hotfix-*' | sed -n 's|^\([0-9a-f]*\)\trefs/tags/\(hotfix-[0-9.]*\)$|\1 \2|p' |
            while read -r sha t; do
              grep -qx "$t" <<< "$KEEP" && continue
              when=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" -q .commit.committer.date) || continue
              [ "$(date -d "$when" +%s)" -lt "$CUTOFF" ] || continue
              echo "deleting tag $t"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
            done
      - name: Not published
        if: env.CHANNEL == 'check' || (env.CHANNEL == 'stable' && !inputs.publish)
        run: echo "Not published (a pull request check, or publish unticked); the files are this run's Stoop-* artifacts" | tee -a "$GITHUB_STEP_SUMMARY"

  # Adds the macOS .dmg to the release publish made, once build-macos is done: the file, its lines in
  # SHA256SUMS, and its Install line in the notes. If the macOS build failed, the notes say so instead.
  # Nothing to do when publish already had the .dmg (macOS finished first) or did not publish.
  mac-attach:
    needs: [version, build-macos, publish]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success'
      && (needs.version.outputs.channel == 'hotfix' || (needs.version.outputs.channel == 'stable' && inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      MAC: ${{ needs.build-macos.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Release notes
        run: gh release view "$TAG" --json body -q .body > notes.md
      - uses: actions/download-artifact@v4
        if: env.MAC == 'success'
        with:
          pattern: "*-macos-aarch64"
          path: mac
          merge-multiple: true
      - name: Sign the .dmg
        if: env.MAC == 'success' && hashFiles(format('mac/Stoop-{0}-macos-aarch64.dmg', env.V)) != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mac/*.dmg
      - name: Attach the .dmg
        run: |
          grep -q 'MACOS-PENDING' notes.md || { echo "the release already has macOS"; exit 0; }
          DMG="Stoop-$V-macos-aarch64.dmg"
          if [ "$MAC" = success ] && [ -f "mac/$DMG" ]; then
            gh release download "$TAG" -p SHA256SUMS -D sums
            { (cd mac && sha256sum -- "$DMG"); cat mac/macos-aarch64.sha256; } >> sums/SHA256SUMS
            gh release upload "$TAG" "mac/$DMG" sums/SHA256SUMS --clobber
            LINE="* **macOS** (Apple silicon): \`$DMG\` (if macOS will not open it the first time: System Settings → Privacy \& Security → Open Anyway)"
          else
            LINE="* **Not in this release:** macOS – its build did not finish this time; the next release has it"
          fi
          sed -i "s|^.*MACOS-PENDING.*\$|$LINE|" notes.md
          gh release edit "$TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
