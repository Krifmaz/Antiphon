name: cleanup-releases

# Repo hygiene only: deletes the named releases and their tags. Normal releases are never overwritten.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated release tags to delete"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $(echo "$TAGS" | tr ',' ' '); do
            echo "deleting $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || echo "nothing to delete for $t"
          done
