[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/audio",
    "crates/protocol",
    "crates/net",
    "crates/app",
    "crates/gui",
    "crates/android",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Audio DSP is optimised even in a debug build, because "debug" changes
# whether it works rather than only how fast it is. An unoptimised echo
# canceller takes ~123% of real time to process a second of audio, so it
# cannot keep up with a live call at all; optimised it takes ~6%. The same
# goes, less dramatically, for the rest of the chain -- every filter runs
# per sample, 48,000 times a second.
#
# Only this crate, so debugging the app itself still gets real symbols and
# fast rebuilds. Measure with:
#   cargo test -p antiphon-audio real_time -- --ignored --nocapture
[profile.dev.package.antiphon-audio]
opt-level = 3

# The same argument for the crypto primitives: every audio frame and every
# file chunk is encrypted and authenticated, and unoptimised ChaCha20 and
# SHA-256 cap a debug build's file transfer at a few MB/s on loopback --
# which made the send-rate controller look broken when it was in fact
# correctly discovering a receiver that could not keep up. Only the
# primitives, so this workspace's own crates still debug normally.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
# No symbol table in release binaries. Not for size (though it halves the
# CLI): on the Windows GNU toolchain, rustc builds import libraries in a
# temporary folder under target\, and the symbol names it gives them embed
# that folder's full path -- the builder's username included -- plus a
# random suffix. --remap-path-prefix does not reach them. Measured: both
# binaries carried "C:\Users\<name>\...\rustcXXXXXX" until this was set,
# which leaked the name *and* made two builds of one commit differ.
# Panic messages keep their file:line locations; only backtrace function
# names are lost.
strip = true

# Spec section 13: "users should be able to verify the binary matches the
# published source". Everything below exists so that two builds of the same
# commit produce the same bytes.
#
# `codegen-units = 1` above is load-bearing for this as well as for speed:
# with more than one, the compiler splits work across threads and the
# resulting symbol ordering depends on scheduling, so the same source can
# produce different bytes on the same machine.
#
# Absolute paths are the other big source of divergence. Without remapping,
# the build directory ends up baked into panic messages -- so a binary built
# in C:\Users\Alice differs from one built in /home/bob, and the builder's
# username leaks into the shipped artifact. See BUILDING.md for the exact
# environment a verifier needs.
[profile.release.package."*"]
codegen-units = 1
