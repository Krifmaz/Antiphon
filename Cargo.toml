[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/audio",
    "crates/protocol",
    "crates/net",
    "crates/app",
    "crates/client",
    "crates/desktop",
    "crates/gui",
    "crates/ui",
    "crates/video",
    "crates/relay",
    "crates/captions",
    "crates/mobile",
    "crates/android",
    "crates/ios",
    "crates/push",
    "crates/update",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Lints every crate opts into with `[lints] workspace = true` (CI already
# turns every warning into an error with `-D warnings`).
#
# On top of clippy's default set, these are the pedantic and nursery lints
# that catch code rot and wasted work rather than matters of taste: clones
# nobody needed, arguments taken by value and never consumed, strings built
# through throwaway `format!`s, `Result`s that can never be `Err`, leftover
# `todo!`/`dbg!`. Taste lints (`map_unwrap_or`, `option_if_let_else`, cast
# lints and the like) are left out on purpose; turning them on would be
# churn, not cleanup.
#
# `allow_attributes` bans `#[allow(...)]`: a warning is fixed, not
# silenced. Where a lint genuinely does not apply (a C plugin ABI's symbol
# names, say), `#[expect(..., reason = "...")]` says why, and turns into an
# error itself the day it stops being needed.
[workspace.lints.rust]
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_import_braces = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
equatable_if_let = "warn"
explicit_iter_loop = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
needless_collect = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
set_contains_or_insert = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
unnecessary_join = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
useless_let_if_seq = "warn"

# Audio DSP is optimised even in a debug build, because "debug" changes
# whether it works rather than only how fast it is. An unoptimised echo
# canceller takes ~123% of real time to process a second of audio, so it
# cannot keep up with a live call at all; optimised it takes ~6%. The same
# goes, less dramatically, for the rest of the chain -- every filter runs
# per sample, 48,000 times a second.
#
# Only this crate, so debugging the app itself still gets real symbols and
# fast rebuilds. Measure with:
#   cargo test -p antiphon-audio real_time -- --ignored --nocapture
[profile.dev.package.antiphon-audio]
opt-level = 3

# Video for the same reason: an unoptimised JPEG encoder and the change
# scan over every pixel take longer than a frame lasts, so a debug build
# would send a slideshow. The codecs underneath are optimised with it.
[profile.dev.package.antiphon-video]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

# The same argument for the crypto primitives: every audio frame and every
# file chunk is encrypted and authenticated, and unoptimised ChaCha20 and
# SHA-256 cap a debug build's file transfer at a few MB/s on loopback --
# which made the send-rate controller look broken when it was in fact
# correctly discovering a receiver that could not keep up. Only the
# primitives, so this workspace's own crates still debug normally.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
# Argon2id is built to be slow; unoptimised it is slow enough (seconds per
# backup at the real cost) that a debug build looks hung when it saves or
# opens an account backup.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Live captions (spec §7): the speech model is matrix multiplication all
# the way down, and unoptimised it runs tens of times slower than real
# time -- captions would arrive long after the words, or be dropped as
# stale. Same reasoning as the audio crate above.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3

# The voice codec, for the same reason: every packet of every call is
# encoded and decoded through it. Its debug assertions are off as well:
# one of them, in the fullband path the app never selects (see
# `antiphon_net::voice`), fires on ordinary speech, and a release build
# never checks it anyway.
[profile.dev.package.mousiki]
opt-level = 3
debug-assertions = false

[profile.release]
lto = true
codegen-units = 1
# No symbol table in release binaries. Not for size (though it halves the
# CLI): on the Windows GNU toolchain, rustc builds import libraries in a
# temporary folder under target\, and the symbol names it gives them embed
# that folder's full path -- the builder's username included -- plus a
# random suffix. --remap-path-prefix does not reach them. Measured: both
# binaries carried "C:\Users\<name>\...\rustcXXXXXX" until this was set,
# which leaked the name *and* made two builds of one commit differ.
# Panic messages keep their file:line locations; only backtrace function
# names are lost.
strip = true

# Spec section 13: "users should be able to verify the binary matches the
# published source". Everything below exists so that two builds of the same
# commit produce the same bytes.
#
# `codegen-units = 1` above is load-bearing for this as well as for speed:
# with more than one, the compiler splits work across threads and the
# resulting symbol ordering depends on scheduling, so the same source can
# produce different bytes on the same machine.
#
# Absolute paths are the other big source of divergence. Without remapping,
# the build directory ends up baked into panic messages -- so a binary built
# in C:\Users\Alice differs from one built in /home/bob, and the builder's
# username leaks into the shipped artifact. See BUILDING.md for the exact
# environment a verifier needs.
[profile.release.package."*"]
codegen-units = 1
