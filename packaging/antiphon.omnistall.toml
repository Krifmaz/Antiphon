# Omnistall manifest for Antiphon (https://github.com/Krifmaz/Omnistall).
#
# Copy to Omnistall's manifests/antiphon.toml, set that repository's
# OMNISTALL_MANIFEST variable to manifests/antiphon.toml, and tag a release
# there: every installer it builds then installs Antiphon with one click,
# downloading the archives this repository's own release pipeline publishes
# (built twice and byte-compared before anything is uploaded) and verifying
# them against SHA256SUMS.txt from the same release.
#
# Bump app.version when a new Antiphon release goes out.
schema = 1

[app]
name = "antiphon"
display_name = "Antiphon"
version = "0.1.0-rc1"
description = "Private peer-to-peer voice chat with a studio-grade mic chain, end-to-end encrypted, no servers."
publisher = "Krifmaz"
homepage = "https://github.com/Krifmaz/Antiphon"
license = "MIT"
icon = "https://raw.githubusercontent.com/Krifmaz/Antiphon/main/crates/gui/ui/tray-icon.png"
kind = "gui"

# Prebuilt, from this repository's GitHub Release for tag v{version}.
# The archives hold antiphon(.exe) and antiphon-cli(.exe) at top level.
[sources.windows-x86_64]
type = "github"
repo = "Krifmaz/Antiphon"
asset = "antiphon-x86_64-pc-windows-msvc.zip"
checksum_asset = "SHA256SUMS.txt"

[sources.macos-aarch64]
type = "github"
repo = "Krifmaz/Antiphon"
asset = "antiphon-aarch64-apple-darwin.tar.gz"
checksum_asset = "SHA256SUMS.txt"

[sources.linux-x86_64]
type = "github"
repo = "Krifmaz/Antiphon"
asset = "antiphon-x86_64-unknown-linux-gnu.tar.gz"
checksum_asset = "SHA256SUMS.txt"

# Anything else (Intel Mac, ARM Linux, Windows on ARM): build from source.
[sources.any]
type = "git"
url = "https://github.com/Krifmaz/Antiphon.git"
rev = "v{version}"

[build]
toolchains = [{ name = "rust", version = ">=1.97" }, "git"]
commands = ["cargo build --release --locked"]
outputs = [
  { path = "target/release/antiphon", install_as = "antiphon" },
  { path = "target/release/antiphon-cli", install_as = "antiphon-cli" },
]
[build.linux]
# BUILDING.md: ALSA, xkbcommon, fontconfig and D-Bus headers are needed too
# (libasound2-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev).
toolchains = [{ name = "rust", version = ">=1.97" }, "git", "cc", "pkg-config"]
[build.windows]
outputs = [
  { path = "target/release/antiphon.exe", install_as = "antiphon.exe" },
  { path = "target/release/antiphon-cli.exe", install_as = "antiphon-cli.exe" },
]

[install]
executable = "antiphon"
bin = ["antiphon-cli"]
add_to_path = false
[install.windows]
executable = "antiphon.exe"
bin = ["antiphon-cli.exe"]

[[shortcuts]]
name = "Antiphon"
exec = "antiphon"
comment = "Private peer-to-peer voice chat"
categories = ["AudioVideo", "Audio", "Network", "Chat"]
